# Infra local do NDev Chatbot.
# Portas publicadas apenas em 127.0.0.1: nada fica exposto na rede.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ndev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ndev
      POSTGRES_PASSWORD: ndev
      POSTGRES_DB: ndev_chatbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ndev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndev -d ndev_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ndev-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ndev-pgdata:
